[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taintmem"
version = "0.1.0"
description = "Provenance-tracked memory for AI agents: taint labels that survive LLM rewriting, with policy-gated actions"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["taintmem*", "evals*"]

[project.scripts]
taintmem = "taintmem.cli:main"
